name: JVM Compile Check
on:
  push:
    branches:
      - dev
  pull_request:
    types:
      - opened
    branches:
      - dev
concurrency:
  group: jvm-compile-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create local properties
        run: |
          echo "app.release.apiBaseUrl=${{ secrets.CONFIG_API_BASE_URL }}" > local.properties
          echo "app.dev.apiBaseUrl=${{ secrets.CONFIG_API_BASE_URL }}" >> local.properties
          echo "app.release.assetsBaseUrl=${{ secrets.CONFIG_ASSETS_BASE_URL }}" >> local.properties
          echo "app.dev.assetsBaseUrl=${{ secrets.CONFIG_ASSETS_BASE_URL }}" >> local.properties
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rustLib/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build rust library
        working-directory: ./rustLib
        run: |
          cargo build --lib
          mkdir -p ../composeApp/src/jvmMain/resources && cp target/debug/libhachimi.dylib ../composeApp/src/jvmMain/resources
          cargo run --bin uniffi-bindgen generate \
            --library target/debug/libhachimi.dylib \
            --language kotlin --out-dir ../composeApp/src/jvmMain/kotlin
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Compile
        run: ./gradlew :desktopApp:compileKotlin
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create local properties
        run: |
          echo "app.release.apiBaseUrl=${{ secrets.CONFIG_API_BASE_URL }}" > local.properties
          echo "app.dev.apiBaseUrl=${{ secrets.CONFIG_API_BASE_URL }}" >> local.properties
          echo "app.release.assetsBaseUrl=${{ secrets.CONFIG_ASSETS_BASE_URL }}" >> local.properties
          echo "app.dev.assetsBaseUrl=${{ secrets.CONFIG_ASSETS_BASE_URL }}" >> local.properties
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rustLib/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build rust library
        working-directory: ./rustLib
        shell: bash
        run: |
          cargo build --lib
          mkdir -p ../composeApp/src/jvmMain/resources && cp target/debug/hachimi.dll ../composeApp/src/jvmMain/resources
          cargo run --bin uniffi-bindgen generate \
            --library target/debug/hachimi.dll \
            --language kotlin --out-dir ../composeApp/src/jvmMain/kotlin
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Compile
        run: ./gradlew :desktopApp:compileKotlin
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create local properties
        run: |
          echo "app.release.apiBaseUrl=${{ secrets.CONFIG_API_BASE_URL }}" > local.properties
          echo "app.dev.apiBaseUrl=${{ secrets.CONFIG_API_BASE_URL }}" >> local.properties
          echo "app.release.assetsBaseUrl=${{ secrets.CONFIG_ASSETS_BASE_URL }}" >> local.properties
          echo "app.dev.assetsBaseUrl=${{ secrets.CONFIG_ASSETS_BASE_URL }}" >> local.properties
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rustLib/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: |
          sudo apt install libasound2-dev # This is essential for build `rodio` dependency.
          sudo apt install libdbus-1-dev
      - name: Build rust library
        working-directory: ./rustLib
        run: |
          cargo build --lib
          mkdir -p ../composeApp/src/jvmMain/resources && cp target/debug/libhachimi.so ../composeApp/src/jvmMain/resources
          cargo run --bin uniffi-bindgen generate \
            --library target/debug/libhachimi.so \
            --language kotlin --out-dir ../composeApp/src/jvmMain/kotlin
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Compile
        run: ./gradlew :desktopApp:compileKotlin

  # One message per run. Skipped when the run was cancelled or every job was skipped.
  notify-discord:
    needs: [ compile-macos, build-windows, build-linux ]
    if: ${{ !cancelled() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-latest
    steps:
      # Expressions cannot slice strings, so shorten the SHA here
      - name: Short SHA
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "SHORT_SHA=${SHA:0:7}" >> "$GITHUB_ENV"
      # Two steps, one per result, like the server's Woodpecker pipelines.
      - name: Notify success
        if: ${{ !contains(needs.*.result, 'failure') }}
        uses: appleboy/discord-action@v1.2.0
        # A Discord outage should not mark the workflow as failed
        continue-on-error: true
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: |
            ✅ Succeeded: ${{ github.event.repository.name }} · ${{ github.workflow }} · ${{ github.head_ref || github.ref_name }} @ ${{ env.SHORT_SHA }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Notify failure
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: appleboy/discord-action@v1.2.0
        # A Discord outage should not mark the workflow as failed
        continue-on-error: true
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: |
            ❌ Failed: ${{ github.event.repository.name }} · ${{ github.workflow }} · ${{ github.head_ref || github.ref_name }} @ ${{ env.SHORT_SHA }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
