name: Deploy to Pages
on:
  pull_request:
    types: [ closed ]
    branches: [ main ]
  push:
    branches: [ dev ]
concurrency:
  group: pages-deployment-${{ github.event_name == 'push' && 'dev' || 'main' }}
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create local properties
        env:
          RELEASE_API_BASE_URL: ${{ secrets.CONFIG_API_BASE_URL }}
          RELEASE_ASSETS_BASE_URL: ${{ secrets.CONFIG_ASSETS_BASE_URL }}
          DEV_API_BASE_URL: ${{ secrets.CONFIG_DEV_API_BASE_URL || secrets.CONFIG_API_BASE_URL }}
          DEV_ASSETS_BASE_URL: ${{ secrets.CONFIG_DEV_ASSETS_BASE_URL || secrets.CONFIG_ASSETS_BASE_URL }}
        run: |
          {
            printf 'app.release.apiBaseUrl=%s\n' "$RELEASE_API_BASE_URL"
            printf 'app.dev.apiBaseUrl=%s\n' "$DEV_API_BASE_URL"
            printf 'app.release.assetsBaseUrl=%s\n' "$RELEASE_ASSETS_BASE_URL"
            printf 'app.dev.assetsBaseUrl=%s\n' "$DEV_ASSETS_BASE_URL"
          } > local.properties
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build with Gradle
        env:
          BUILD_FLAVOR: ${{ github.event_name == 'push' && 'dev' || 'release' }}
        run: ./gradlew webApp:composeCompatibilityBrowserDistribution -Pbuildkonfig.flavor="$BUILD_FLAVOR"
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: webApp/build/compose/logs/
      - name: Get versions
        shell: bash
        run: |
          VERSIONS=$(./gradlew printVersions --quiet)
          VERSION_NAME=$(echo "$VERSIONS" | awk '{print $1}')
          VERSION_CODE=$(echo "$VERSIONS" | awk '{print $2}')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
      - name: Copy favicon.ico
        run: cp icons/icon.ico webApp/build/dist/composeWebCompatibility/productionExecutable/favicon.ico
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy webApp/build/dist/composeWebCompatibility/productionExecutable --project-name=hachimi-world-client --branch=${{ github.event_name == 'push' && 'dev' || 'main' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
