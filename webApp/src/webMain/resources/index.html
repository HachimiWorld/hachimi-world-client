<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#EBE9E7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#2B2A25" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>基米天堂</title>

    <style>
        :root {
            color-scheme: light dark;
            --loading-background: #EBE9E7;
            --loading-text: rgba(0, 0, 0, 0.87);
            --loading-muted: rgba(0, 0, 0, 0.60);
            --loading-track: rgba(0, 0, 0, 0.10);
            --loading-outline: rgba(0, 0, 0, 0.20);
            --loading-accent: #FF7022;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: var(--loading-background);
            color: var(--loading-text);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }

        .loading-content {
            width: min(280px, 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loading-icon {
            position: relative;
            width: 128px;
            height: 128px;
        }

        .loading-icon img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .loading-icon-pulse {
            position: absolute;
            inset: 0;
            opacity: 0;
            animation: loading-pulse 1.45s cubic-bezier(0.18, 0.75, 0.3, 1) infinite;
        }

        #tip {
            margin: 12px 0 0;
            color: var(--loading-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .loading-track {
            width: 100%;
            height: 3px;
            margin-top: 28px;
            overflow: hidden;
            border-radius: 99px;
            background: var(--loading-track);
        }

        .loading-track::after {
            content: "";
            display: block;
            width: 38%;
            height: 100%;
            border-radius: inherit;
            background: var(--loading-accent);
            animation: loading-sweep 2s ease-in-out infinite;
        }

        .loading-track.has-progress::after {
            width: var(--loading-progress, 0%);
            animation: none;
        }

        #loading-percent {
            min-height: 18px;
            margin-top: 10px;
            color: var(--loading-muted);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }

        #tip2 {
            position: absolute;
            right: 24px;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: 24px;
            margin: 0;
            color: var(--loading-muted);
            font-size: 12px;
            line-height: 1.6;
        }

        #tip2 a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .loading-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
        }

        .loading-actions[hidden] {
            display: none;
        }

        .loading-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 20px;
            box-sizing: border-box;
            border: 1px solid transparent;
            border-radius: 99px;
            font: inherit;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .loading-button.primary {
            background: var(--loading-accent);
            color: #FFFFFF;
        }

        .loading-button.secondary {
            background: transparent;
            border-color: var(--loading-outline);
            color: var(--loading-text);
        }

        #loading.failed .loading-track,
        #loading.failed #loading-percent {
            display: none;
        }

        #loading.failed .loading-icon-pulse {
            animation: none;
        }

        #loading.failed #tip {
            color: var(--loading-text);
        }

        @keyframes loading-pulse {
            0% { transform: scale(1); opacity: 0.6; }
            55%, 100% { transform: scale(1.35); opacity: 0; }
        }

        @keyframes loading-sweep {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(165%); }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --loading-background: #2B2A25;
                --loading-text: rgba(255, 255, 255, 0.87);
                --loading-muted: rgba(255, 255, 255, 0.60);
                --loading-track: rgba(255, 255, 255, 0.10);
                --loading-outline: rgba(255, 255, 255, 0.24);
                --loading-accent: #FF782F;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-icon-pulse, .loading-track::after {
                animation: none;
            }
        }
    </style>
    <script>
        // Load failure fallback. Kept to ES5 on purpose: it must still run, and offer the lite
        // web app, when the browser is too old to parse the loader script below.
        var hachimiLoad = (function () {
            var STALL_TIMEOUT = 45000;
            var UNSUPPORTED = "当前浏览器无法运行网页端，可使用轻量版";
            var failed = false;
            var lastActivity = new Date().getTime();

            function byId(id) {
                return document.getElementById(id);
            }

            function show(id) {
                var element = byId(id);
                if (element) element.removeAttribute("hidden");
            }

            function isLoading() {
                return !!byId("loading");
            }

            function setTip(message) {
                var tip = byId("tip");
                if (!tip) return;
                tip.textContent = message;
                tip.removeAttribute("hidden");
            }

            function fail(message) {
                var loading = byId("loading");
                if (!loading || failed) return;
                failed = true;
                loading.className += " failed";
                setTip(message || "加载失败，请刷新重试，或使用轻量版");
                show("load-actions");
            }

            function activity() {
                lastActivity = new Date().getTime();
            }

            function isSameOriginScript(filename) {
                if (!filename) return true;
                var origin = location.protocol + "//" + location.host;
                return filename.indexOf(origin) === 0;
            }

            window.addEventListener("error", function (event) {
                // Errors thrown by browser extensions are not ours to report.
                if (!isLoading() || !isSameOriginScript(event.filename)) return;
                fail(event.error && event.error.name === "SyntaxError" ? UNSUPPORTED : undefined);
            });

            window.addEventListener("unhandledrejection", function (event) {
                if (!isLoading()) return;
                var reason = event.reason;
                if (typeof WebAssembly !== "undefined" && reason instanceof WebAssembly.CompileError) {
                    fail(UNSUPPORTED);
                } else {
                    fail();
                }
            });

            window.addEventListener("load", function () {
                // The loader below sets this flag first. When it is missing, the browser could not parse it.
                if (!window.__hachimiLoaderStarted) fail(UNSUPPORTED);
            });

            setTimeout(function () {
                if (isLoading() && !failed) setTip("首次加载需要较长时间，请耐心等待");
            }, 6000);

            setTimeout(function () {
                if (isLoading()) show("tip2");
            }, 15000);

            var stallTimer = setInterval(function () {
                if (!isLoading() || failed) {
                    clearInterval(stallTimer);
                } else if (new Date().getTime() - lastActivity > STALL_TIMEOUT) {
                    fail("加载长时间没有进展，请检查网络连接");
                }
            }, 5000);

            return { fail: fail, activity: activity };
        })();
    </script>
    <script>
        var currentLanguagesImplementation = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
        var newLanguagesImplementation = Object.assign({}, currentLanguagesImplementation, {
            get: function () {
                if (window.__customLocale) {
                    return [window.__customLocale];
                } else {
                    return currentLanguagesImplementation.get.apply(this);
                }
            }
        });

        Object.defineProperty(Navigator.prototype, "languages", newLanguagesImplementation)
    </script>
    <script>
        window.__hachimiLoaderStarted = true
        let fallback = false

        const scriptLoaded = () => {
            console.log("Web app script loaded")
            hachimiLoad.activity()
        }

        const scriptError = () => {
            if (fallback === false) {
                fallback = true
                // Maybe in development mode, so we try to load webApp.js, because we haven't created the compatible dist
                document.body.appendChild(createScript("webApp.js"));
            } else {
                hachimiLoad.fail()
            }
        }

        const createScript = (src) => {
            const script = document.createElement("script");
            script.src = src;
            script.type = "application/javascript";
            script.onload = scriptLoaded
            script.onerror = scriptError
            return script;
        }

        const monitorWasmLoading = () => {
            if (typeof window.fetch !== "function" || typeof Response === "undefined") return;

            const originalFetch = window.fetch;
            const percentLabel = document.getElementById("loading-percent");
            const progressTrack = document.getElementById("loading-track");
            let loadedBytes = 0;
            let totalBytes = 0;
            let totalIsKnown = true;
            let displayedUnits = 0;
            let assetSizes;
            const resourceProgress = new Map();
            const readers = new Set();

            // Only inspect Wasm startup requests. Keep the original Response intact for
            // instantiateStreaming. Response body chunks are decoded, while
            // Content-Length describes encoded bytes when Content-Encoding is set.
            // The entry bundle supplies decoded sizes as `__hachimiWasmSizes`, recorded at
            // build time by `webApp/webpack.config.d/wasm-progress.js`.
            const updateProgressLabel = () => {
                if (!totalIsKnown || totalBytes < loadedBytes || totalBytes === 0) {
                    percentLabel.textContent = "";
                    percentLabel.hidden = true;
                    progressTrack.classList.remove("has-progress");
                    return;
                }
                const percent = Math.min(100, Math.floor(loadedBytes / totalBytes * 100));
                percentLabel.textContent = `${percent}%`;
                percentLabel.hidden = false;
                progressTrack.style.setProperty("--loading-progress", `${percent}%`);
                progressTrack.classList.add("has-progress");
            };

            const monitoredFetch = function (resource, options) {
                const url = typeof resource === "string" ? resource : resource?.url ?? String(resource);
                if (!/\.wasm(?:[?#]|$)/i.test(url)) {
                    return originalFetch.apply(this, arguments);
                }

                return originalFetch.apply(this, arguments).then((response) => {
                    hachimiLoad.activity();
                    if (!response.ok) {
                        console.error("[WasmProgress] Failed to download", url, response.status);
                        hachimiLoad.fail();
                    }
                    if (response.ok && response.body) {
                        try {
                            const reader = response.clone().body.getReader();
                            readers.add(reader);
                            const contentLength = Number(response.headers.get("Content-Length"));
                            const contentEncoding = response.headers.get("Content-Encoding");
                            if (assetSizes === undefined) {
                                assetSizes = Object.entries(window.__hachimiWasmSizes ?? {})
                                    .filter(([name, size]) => name.endsWith(".wasm") &&
                                        Number.isSafeInteger(size) && size > 0);
                                totalBytes = assetSizes.reduce((sum, [, size]) => sum + size, 0);
                                console.info("[WasmProgress] Build-time sizes", {
                                    sizes: Object.fromEntries(assetSizes), totalBytes
                                });
                            }
                            const pathname = new URL(url, document.baseURI).pathname;
                            const asset = assetSizes.find(([name]) => pathname.endsWith(`/${name}`));
                            const resourceKey = asset?.[0] ?? pathname;
                            const expectedBytes = asset?.[1] ?? (
                                Number.isSafeInteger(contentLength) && contentLength > 0 &&
                                (!contentEncoding || contentEncoding.toLowerCase() === "identity")
                                    ? contentLength : null);
                            if (!resourceProgress.has(resourceKey)) {
                                resourceProgress.set(resourceKey, 0);
                                if (!asset) {
                                    if (expectedBytes !== null) totalBytes += expectedBytes;
                                    else totalIsKnown = false;
                                }
                            }
                            updateProgressLabel();
                            (async () => {
                                let responseLoadedBytes = 0;
                                try {
                                    while (true) {
                                        const { done, value } = await reader.read();
                                        if (done) break;
                                        responseLoadedBytes += value.byteLength;
                                        hachimiLoad.activity();
                                        const previousBytes = resourceProgress.get(resourceKey);
                                        const currentBytes = Math.max(previousBytes, responseLoadedBytes);
                                        resourceProgress.set(resourceKey, currentBytes);
                                        loadedBytes += currentBytes - previousBytes;
                                        const units = Math.floor(loadedBytes / (256 * 1024));
                                        if (units > displayedUnits) {
                                            displayedUnits = units;
                                            updateProgressLabel();
                                        }
                                    }
                                    updateProgressLabel();
                                    console.info("[WasmProgress] Loaded", {
                                        url, loadedBytes: responseLoadedBytes, expectedBytes,
                                        contentLength, contentEncoding,
                                        totalLoadedBytes: loadedBytes, totalBytes, totalIsKnown
                                    });
                                } finally {
                                    readers.delete(reader);
                                }
                            })().catch(() => {});
                        } catch (_) {
                            // The animated loader remains usable when a response cannot be cloned.
                        }
                    }
                    return response;
                });
            };

            window.fetch = monitoredFetch;
            const observer = new MutationObserver(() => {
                if (document.getElementById("loading")) return;
                if (window.fetch === monitoredFetch) window.fetch = originalFetch;
                for (const reader of readers) reader.cancel().catch(() => {});
                observer.disconnect();
            });
            observer.observe(document.body, { childList: true });
        }

        const loadApp = () => {
            const simpleWasmModule = new Uint8Array([
                0, 97, 115, 109, 1, 0, 0, 0, 1, 8, 2, 95,
                1, 120, 0, 96, 0, 0, 3, 3, 2, 1, 1, 10,
                14, 2, 6, 0, 6, 64, 25, 11, 11, 5, 0, 208,
                112, 26, 11, 0, 45, 4, 110, 97, 109, 101, 1, 15,
                2, 0, 5, 102, 117, 110, 99, 48, 1, 5, 102, 117,
                110, 99, 49, 4, 8, 1, 0, 5, 116, 121, 112, 101,
                48, 10, 11, 1, 0, 1, 0, 6, 102, 105, 101, 108,
                100, 48
            ]);

            const hasSupportOfAllRequiredWasmFeatures = () =>
                typeof WebAssembly !== "undefined" &&
                typeof WebAssembly?.validate === "function" &&
                WebAssembly.validate(simpleWasmModule);

            if (typeof WebAssembly === "undefined") {
                // Even the JS build needs WebAssembly for the Skia renderer.
                hachimiLoad.fail("当前浏览器无法运行网页端，可使用轻量版");
                return;
            }

            const useWasm = hasSupportOfAllRequiredWasmFeatures();
            monitorWasmLoading();
            document.body.appendChild(createScript(useWasm ? "originWasmWebApp.js" : "originJsWebApp.js"));
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", loadApp);
        } else {
            loadApp();
        }
    </script>
</head>
<body>
<div id="loading" role="status" aria-label="正在加载基米天堂">
    <div class="loading-content">
        <div class="loading-icon" aria-hidden="true">
            <img src="icon_3d.webp" alt="">
            <img class="loading-icon-pulse" src="icon_3d.webp" alt="">
        </div>
        <p id="tip" hidden></p>
        <div id="loading-track" class="loading-track" aria-hidden="true"></div>
        <div id="loading-percent" aria-hidden="true" hidden></div>
        <div id="load-actions" class="loading-actions" hidden>
            <a class="loading-button primary" href="https://www.hachimi.world/">使用轻量版</a>
            <button class="loading-button secondary" type="button" onclick="location.reload()">刷新重试</button>
        </div>
    </div>
    <p id="tip2" hidden>
        网页端为实验性功能<br>若持续无法加载，请检查网络连接、更新浏览器，或改用<a href="https://www.hachimi.world/">轻量版</a>
    </p>
</div>
</body>
</html>
